# Runs on every push and pull request: lint, tests, production build.
# Nothing here deploys. Vercel deploys on its own; this only tells you whether the code is sound.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci fails on Linux with a lockfile written on Windows (npm/cli#4828: optional
      # platform deps like @emnapi/* are missing). npm install tolerates it. Phase 2 moves to pnpm.
      - run: npm install --no-audit --no-fund
      - run: npx eslint app lib components tests
      - run: npm test
      # The DB contract checks need the local Supabase stack (Docker), which CI does not start:
      # pgTAP (`npx supabase test db`) and the generated-types drift test are skipped here.
      - run: echo "::notice title=DB contract not checked in CI::pgTAP and the generated-types drift test need the local Supabase stack. Run npx supabase start, npx supabase test db, npm test locally before merging a migration."
      - run: npm run build
        env:
          # Placeholders only: the build prerenders pages that construct a Supabase client.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
