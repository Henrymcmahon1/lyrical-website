<!--
  Lyrical email signature.

  Gmail: Settings > See all settings > General > Signature > Create new. Open this file in
  a browser, select all, copy, then paste into the signature box.

  Table layout with inline styles, because email clients strip stylesheets. The mark is the
  approximately-equal character rather than an image, so there is nothing to block and
  nothing to attach.

  Replace NAME, ROLE and EMAIL.
-->
<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td style="padding-right:14px;border-right:2px solid #4433D6;">
      <span style="font-family:Georgia,serif;font-size:30px;line-height:1;color:#4433D6;">&#8776;</span>
    </td>
    <td style="padding-left:14px;">
      <div style="font-family:Georgia,serif;font-size:16px;color:#1C1A19;font-weight:bold;">NAME</div>
      <div style="font-size:13px;color:#55504A;padding-top:2px;">ROLE &middot; Lyrical</div>
      <div style="font-size:13px;padding-top:6px;">
        <a href="mailto:EMAIL" style="color:#4433D6;text-decoration:none;">EMAIL</a>
      </div>
      <div style="font-size:12px;color:#857E74;padding-top:8px;">
        Every song. Any language. Same soul.
      </div>
    </td>
  </tr>
</table>
